name: CI

on:
  pull_request:
    branches: [ main, develop, prototype ]
  push:
    branches: [ main, develop, prototype ]

# 같은 브랜치에 새 커밋이 올라오면 진행 중이던 검증은 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: devica_test
          TZ: Asia/Seoul
        ports:
          # test/application.yml 의 TEST_DB_PORT 값을 컨테이너의 3306 에 매핑한다.
          # 그 값을 바꾸면 이 포트도 함께 고쳐야 한다.
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-retries=10

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 추천 정책 JS 테스트
        run: node --test src/test/js/*.test.js

      - name: 빌드 및 테스트
        run: ./gradlew build

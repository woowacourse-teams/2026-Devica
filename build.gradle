plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wrb'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'com.querydsl:querydsl-jpa::jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt::jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'io.rest-assured:rest-assured:6.0.0'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    //mysql
    runtimeOnly 'com.mysql:mysql-connector-j'

    // flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
}

tasks.named('test') {
    useJUnitPlatform()
}

springBoot {
    mainClass = 'com.wrb.devica.DevicaApplication'
}

// Spring 서버와 DB 없이 파트너스 검색 응답의 옵션 식별자를 검증한다.
tasks.register('coupangPriceProbe', JavaExec) {
    group = 'verification'
    description = '쿠팡 대표 상품의 검색 응답을 조회하고 검토용 JSON 보고서를 생성한다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wrb.devica.product.infra.coupang.CoupangPriceProbe'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 기존 키 파일을 읽어 로컬 DB 가격을 한 번 갱신한 뒤 종료한다.
tasks.register('coupangPriceRefresh', JavaExec) {
    group = 'application'
    description = '기존 쿠팡 판매상품 가격을 로컬 DB에 1회 갱신한다.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.wrb.devica.product.infra.coupang.CoupangPriceRefreshLocal'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 라이브러리로 배포하지 않으므로 plain jar 는 만들지 않는다.
// build 시 jar 가 두 개 생기면 Dockerfile 의 COPY build/libs/*.jar 가 실패한다.
tasks.named('jar') {
    enabled = false
}


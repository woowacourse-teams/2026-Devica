# 서버 배포용. 개발 서버와 운영 서버가 이 파일 하나를 함께 쓴다. 로컬 개발은 docker-compose.yml 을 쓴다.
#   IMAGE_TAG=<커밋 SHA> docker compose -f docker-compose.server.yml up -d
services:
  app:
    image: devica:${IMAGE_TAG}
    pull_policy: never
    container_name: devica-app
    env_file: .env
    environment:
      # 필수 환경변수가 .env에 없으면 컨테이너를 만들기 전에 실패한다.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?각 서버의 .env 에 SPRING_PROFILES_ACTIVE 를 지정한다}
      PRODUCT_IMAGE_BASE_URL: ${PRODUCT_IMAGE_BASE_URL:?각 서버의 .env 에 PRODUCT_IMAGE_BASE_URL 을 지정한다}
      TZ: Asia/Seoul
      LOGGING_FILE_NAME: /var/log/devica/app.log
      LOGGING_STRUCTURED_FORMAT_FILE: ecs
      LOGGING_LOGBACK_ROLLINGPOLICY_MAXFILESIZE: 10MB
      LOGGING_LOGBACK_ROLLINGPOLICY_MAXHISTORY: "7"
      LOGGING_LOGBACK_ROLLINGPOLICY_TOTALSIZECAP: 100MB
      LOGGING_LOGBACK_ROLLINGPOLICY_CLEANHISTORYONSTART: "true"
    volumes:
      - type: bind
        source: ./logs/app
        target: /var/log/devica
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: devica-db
    env_file: .env
    environment:
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --log-error=/var/log/mysql/error.log
    volumes:
      - mysql-data:/var/lib/mysql
      - type: bind
        source: ./logs/db
        target: /var/log/mysql
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 접속 정보가 .env 에 없어도 앱 배포는 막지 않는다. 이때는 이 컨테이너만 실패한다.
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: devica-alloy
    # 호스트 지표의 instance 라벨이 된다. 고정하지 않으면 재생성할 때마다 새 series 로 갈린다.
    hostname: devica-${SPRING_PROFILES_ACTIVE}
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/devica-alloy
    environment:
      DEVICA_ENV: ${SPRING_PROFILES_ACTIVE}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # 디스크 사용률은 이 디렉터리가 속한 루트 디스크 값으로 잰다. / 를 통째로 열면 docker.sock 과 .env 가 보인다.
      - ./monitoring:/host/root:ro
      - type: bind
        source: ./logs
        target: /var/log/devica
        read_only: true
        bind:
          create_host_path: false
      - alloy-data:/var/lib/devica-alloy
    user: "0:0"
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 256m
    restart: unless-stopped

volumes:
  mysql-data:
  alloy-data:

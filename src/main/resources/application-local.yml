spring:
  datasource:
    # 3306 이 이미 쓰이고 있으면 DB_PORT 환경변수로 바꾼다 (이 파일은 고치지 않는다)
    url: jdbc:mysql://localhost:${DB_PORT:3306}/devica?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true

logging:
  pattern:
    correlation: "[%X{trace.id:-}] %kvp "
  level:
    com.wrb.devica: debug
    org.hibernate.orm.jdbc.bind: trace

app:
  # 로컬에서는 개발용 제품 이미지를 실제 S3에서 확인한다.
  product-image-base-url: https://techcourse-project-2026.s3.ap-northeast-2.amazonaws.com

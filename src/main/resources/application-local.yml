spring:
  datasource:
    # 3306 이 이미 쓰이고 있으면 DB_PORT 환경변수로 바꾼다 (이 파일은 고치지 않는다)
    url: jdbc:mysql://localhost:${DB_PORT:3306}/devica?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 켜지 않으면 data.sql 이 Hibernate 의 테이블 생성보다 먼저 실행되어 실패한다
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

# 결과 화면의 근거 문장 중 아래 8종은 이 파일이 아니라 LaptopRecommender 가 만든다.
# 피드백 받은 문장이 여기서 검색되지 않으면 그 클래스를 본다.
#
# 모든 결과에 붙는 안내
#   - "<OS> 권장안입니다."
#   - "권장 CPU 는 <CPU> 입니다."
#   - "권장 메모리는 <N>GB 입니다."
#   - "권장 저장 공간은 <용량> 입니다."
# 점수로 고른 사양을 바꾸는 보정
#   - "지금 쓰는 <CPU> 에서 불편을 겪어 그보다 위를 권합니다."      CURRENT_CPU_TIER 매핑이 있으면 CPU 를 한 단계 위로
#   - "예산을 고려해 Mac 권장 CPU 는 <CPU>으로 제한했습니다."        Mac CPU 를 interpretation.macCpuLimit 까지로 제한
#   - "<N>GB 를 쓰려면 <CPU> 이상이어야 합니다."                     Mac 은 CPU 마다 고를 수 있는 메모리가 달라 CPU 를 올림
#   - "<CPU> 에서 고를 수 있는 가장 가까운 용량은 <N>GB 입니다."     Mac 메모리를 고를 수 있는 용량으로 맞춤
#
# 규칙을 고친 뒤에는 RecommendationServiceTest 의 설명대로 스냅숏을 다시 만들어 결과 변화를 diff 로 확인한다.

survey:
  steps:
    # 모름·미입력은 답을 보내지 않는 것으로 표현한다. UNKNOWN 선택지를 두지 않는다
    - title: 현재 사용하는 노트북 사양을 알려주세요
      layout: CURRENT_SPEC
      questions:
        - code: CURRENT_OS
          title: 지금 쓰는 노트북의 OS는 무엇인가요?
          description: 모든 항목은 선택 사항입니다. 입력하지 않아도 다음으로 넘어갈 수 있어요.
          label: OS
          options:
            - { code: MACOS, content: Mac }
            - { code: WINDOWS, content: Windows }
        - code: CURRENT_MAC_CPU
          title: 지금 쓰는 Mac 의 프로세서는 무엇인가요?
          label: PROCESSOR
          showWhen: { question: CURRENT_OS, anyOf: [ MACOS ] }
          options:
            - { code: BASIC, content: M 칩 }
            - { code: PRO, content: M Pro 칩 }
            - { code: MAX, content: M Max 칩 }
        - code: CURRENT_WINDOWS_CPU
          title: 지금 쓰는 노트북의 프로세서는 무엇인가요?
          label: PROCESSOR
          showWhen: { question: CURRENT_OS, anyOf: [ WINDOWS ] }
          options:
            - { code: U, content: Core Ultra 5 235U / Ryzen AI 5 340급 }
            - { code: P_HS, content: Core Ultra 7 258V / Ryzen AI 7 445급 }
            - { code: H, content: Core Ultra 7 255H / Ryzen 7 H 260급 }
            - { code: HX, content: Core Ultra 9 275HX / Ryzen 9 8940HX급 }
        - code: CURRENT_MEMORY
          title: 지금 쓰는 노트북의 메모리는 얼마인가요?
          label: MEMORY
          options:
            - { code: GB_8_OR_LESS, content: 8GB 이하 }
            - { code: GB_16, content: 16GB }
            - { code: GB_24, content: 24GB }
            - { code: GB_32, content: 32GB }
            - { code: GB_48, content: 48GB }
            - { code: GB_64_OR_MORE, content: 64GB 이상 }
        - code: CURRENT_STORAGE
          title: 지금 쓰는 노트북의 저장 공간은 얼마인가요?
          label: STORAGE
          options:
            - { code: GB_256_OR_LESS, content: 256GB 이하 }
            - { code: UNDER_1TB, content: 256GB 초과 1TB 미만 }
            - { code: TB_1_OR_MORE, content: 1TB 이상 }

    - questions:
        - code: PREFERRED_OS
          title: 어떤 노트북을 생각하고 계신가요?
          options:
            - { code: MACOS, content: 맥 }
            - { code: WINDOWS, content: 윈도우 }
            - { code: UNDECIDED, content: 아직 안 정했다, description: 결과에서 Mac 과 Windows 권장안을 함께 보여드려요. }

    - questions:
        - code: DESIGN_FIELD
          title: 주로 어떤 디자인을 하나요?
          description: 여러 개를 선택할 수 있어요.
          input: MULTI
          exclusive: UNDECIDED
          options:
            - { code: UI_UX, content: "앱·웹 화면 디자인 (UI·UX)" }
            - { code: GRAPHIC, content: "편집·브랜딩·일러스트" }
            - { code: MOTION_VIDEO, content: "모션 그래픽·영상" }
            - { code: THREE_D, content: "3D 모델링·렌더링" }
            - { code: THREE_D_LIGHT, content: 가끔 3D 작업도 한다 }
            - { code: UNDECIDED, content: 아직 정하지 않았다 }

    # 4K 이상은 Adobe 가 영상 작업에 메모리를 두 배로 권하는 기준이라 따로 묻는다
    - questions:
        - code: VIDEO_RESOLUTION
          title: 주로 다루는 영상의 해상도는 어느 정도인가요?
          showWhen: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO ] }
          options:
            - { code: HD, content: FHD(1080p) 이하 }
            - { code: UHD, content: 4K 이상 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - title: 작업 도구를 알려주세요
      questions:
        # 도구는 OS 판단(Sketch 는 Mac)에만 쓴다. 작업 부담은 분야·무거운 파일 문항과 겹치므로 점수를 주지 않는다
        - code: DESIGN_TOOL
          title: 주로 쓰는 디자인 도구는 무엇인가요?
          description: 여러 개를 선택할 수 있어요.
          input: MULTI
          exclusive: UNDECIDED
          options:
            - { code: FIGMA, content: "Figma, Framer 등" }
            - { code: SKETCH, content: Sketch }
            - { code: ADOBE, content: "Photoshop, Illustrator 등 Adobe 도구" }
            - { code: OTHER, content: "그 밖의 도구(Blender, After Effects 등)" }
            - { code: UNDECIDED, content: 아직 정하지 않았다 }
        - code: MULTITASKING
          title: 작업할 때 디자인 도구를 몇 개나 함께 켜두나요?
          options:
            - { code: MANY, content: 세 개 이상 함께 켜둔다 }
            - { code: FEW, content: 한두 개만 켜둔다 }

    - questions:
        - code: HEAVY_FILE
          title: 작업 파일이 무거워 열거나 저장할 때 오래 기다린 적이 있나요?
          description: 화면이나 레이어, 이미지가 많은 파일을 떠올려 보세요.
          options:
            - { code: OFTEN, content: 자주 그렇다 }
            - { code: FINE, content: 가끔 / 별로 없다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: ASSET_LOCATION
          title: 원본 파일이나 사진·영상 소스는 어디에 두나요?
          options:
            - { code: LOCAL_MANY, content: 대부분 노트북에 저장해 둔다 }
            - { code: MIXED, content: 자주 쓰는 것만 노트북에 둔다 }
            - { code: CLOUD, content: 클라우드나 외장 드라이브에 둔다 }

    - questions:
        - code: SLOWDOWN
          title: 프로그램을 여러 개 켜두면 멈추거나 껐다 켜야 했나요?
          options:
            - { code: OFTEN, content: 자주 그렇다 }
            - { code: SOMETIMES, content: 가끔 느려진다 }
            - { code: FINE, content: 괜찮다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: STORAGE_SHORTAGE
          title: 용량이 부족해서 뭔가를 지우거나 옮긴 적이 있나요?
          options:
            - { code: OFTEN, content: 자주 있다 }
            - { code: ONCE_OR_TWICE, content: 한두 번 있다 }
            - { code: NEVER, content: 없다 }

    - questions:
        - code: RENDER_WAIT
          title: 영상 내보내기나 렌더링이 끝나기를 기다리는 게 답답했나요?
          showWhen: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO, THREE_D, THREE_D_LIGHT ] }
          options:
            - { code: OFTEN, content: 자주 답답했다 }
            - { code: FINE, content: 참을 만했다 / 신경 안 쓰였다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: OVERHEATING
          title: 작업할 때 노트북이 뜨거워지거나 팬이 크게 도나요?
          options:
            - { code: OFTEN, content: 자주 그렇다 }
            - { code: FINE, content: 가끔 / 별로 없다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: USAGE_PERIOD
          title: 이 노트북을 얼마나 쓸 생각인가요?
          options:
            - { code: TWO_YEARS, content: 2년 정도 (곧 바꿀 수 있다) }
            - { code: THREE_TO_FOUR_YEARS, content: 3~4년 }
            - { code: FIVE_PLUS_YEARS, content: 5년 이상 / 오래 쓰고 싶다 }
            - { code: UNDECIDED, content: 아직 안 정했다 }

# 조건 하나로는 크게 오르지 않게 가중치를 나눈다 — 하나만 걸려도 최대로 올리면 답할수록 결과가 달라지지 않아
# 설문이 무의미해지고, 필요보다 높은 사양이 나온다.
rules:
  - criterion: MEMORY
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ GRAPHIC ] }
    reason: 인쇄용 고해상도 이미지와 레이어가 많은 파일은 메모리를 많이 씁니다.
  - criterion: MEMORY
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO ] }
    reason: 모션·영상 작업은 미리보기를 위해 프레임을 메모리에 올려 둡니다.
  - criterion: MEMORY
    weight: 4
    when: { question: DESIGN_FIELD, anyOf: [ THREE_D ] }
    reason: 3D 작업은 장면과 텍스처를 메모리에 올려 두어 넉넉한 용량이 필요합니다.
  - criterion: MEMORY
    weight: 1
    when:
      all:
        - { question: DESIGN_FIELD, anyOf: [ THREE_D_LIGHT ] }
        - { not: { question: DESIGN_FIELD, anyOf: [ THREE_D ] } }
    reason: 가끔 하는 3D 작업도 장면과 텍스처를 메모리에 올려 둡니다.
  - criterion: MEMORY
    weight: 2
    when: { question: VIDEO_RESOLUTION, anyOf: [ UHD ] }
    reason: 4K 이상 영상은 FHD 보다 메모리를 훨씬 많이 씁니다.
  - criterion: MEMORY
    weight: 1
    when: { question: MULTITASKING, anyOf: [ MANY ] }
    reason: 디자인 도구를 여러 개 함께 켜두면 그만큼 메모리를 더 씁니다.
  - criterion: MEMORY
    weight: 1
    when: { question: HEAVY_FILE, anyOf: [ OFTEN ] }
    reason: 무거운 파일을 자주 다루는 경험을 반영했습니다.
  - criterion: MEMORY
    weight: 2
    when: { question: SLOWDOWN, anyOf: [ OFTEN ] }
    reason: 자주 느려진 경험은 메모리가 부족하다는 가장 직접적인 신호입니다.
  - criterion: MEMORY
    weight: 1
    when: { question: SLOWDOWN, anyOf: [ SOMETIMES ] }
    reason: 가끔 느려진 경험을 반영했습니다.
  - criterion: MEMORY
    weight: 1
    when: { question: USAGE_PERIOD, anyOf: [ FIVE_PLUS_YEARS ] }
    reason: 오래 쓸 계획이라 여유를 두었습니다.
  - criterion: MEMORY
    weight: -1
    when: { question: USAGE_PERIOD, anyOf: [ TWO_YEARS ] }
    reason: 짧게 쓸 계획이라 과한 용량을 피했습니다.

  - criterion: STORAGE
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ GRAPHIC ] }
    reason: 고해상도 이미지와 레이어가 많은 원본 파일은 자리를 많이 차지합니다.
  - criterion: STORAGE
    weight: 2
    when: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO ] }
    reason: 영상 소스와 미리보기 캐시가 저장 공간을 크게 씁니다.
  - criterion: STORAGE
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ THREE_D ] }
    reason: 3D 장면과 텍스처, 렌더링 결과물이 자리를 차지합니다.
  - criterion: STORAGE
    weight: 2
    when: { question: VIDEO_RESOLUTION, anyOf: [ UHD ] }
    reason: 4K 이상 영상은 소스와 캐시가 FHD 보다 훨씬 큽니다.
  - criterion: STORAGE
    weight: 2
    when: { question: ASSET_LOCATION, anyOf: [ LOCAL_MANY ] }
    reason: 원본 파일과 소스를 노트북에 모아 두면 저장 공간이 빠르게 찹니다.
  - criterion: STORAGE
    weight: -1
    when:
      all:
        - { question: ASSET_LOCATION, anyOf: [ CLOUD ] }
        - not: &smallDiskShortage
            all:
              - { question: CURRENT_STORAGE, anyOf: [ GB_256_OR_LESS ] }
              - { question: STORAGE_SHORTAGE, anyOf: [ OFTEN, ONCE_OR_TWICE ] }
    reason: 소스를 클라우드나 외장 드라이브에 두면 노트북 저장 공간 부담이 적습니다.
  # 지금 쓰는 SSD 가 작다는 걸 아는 경우의 용량 부족은 디스크 크기 탓이라 크게 올리지 않고, 지금보다 큰 용량만 권한다.
  # 기본값이 256GB 라 이 경우 감점(짧은 사용 기간 등)이 걸리면 다시 256GB 가 나오므로 감점을 적용하지 않는다.
  # 미입력은 작다는 근거가 없으므로 사용자의 자기 보고를 그대로 인정한다
  - criterion: STORAGE
    weight: 2
    when:
      all:
        - { not: { question: CURRENT_STORAGE, anyOf: [ GB_256_OR_LESS, TB_1_OR_MORE ] } }
        - { question: STORAGE_SHORTAGE, anyOf: [ OFTEN ] }
    reason: 용량이 자주 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 1
    when:
      all:
        - { not: { question: CURRENT_STORAGE, anyOf: [ GB_256_OR_LESS, TB_1_OR_MORE ] } }
        - { question: STORAGE_SHORTAGE, anyOf: [ ONCE_OR_TWICE ] }
    reason: 용량이 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 1
    when: *smallDiskShortage
    reason: 지금 256GB 이하에서 용량이 부족했던 경험을 반영해 그보다 큰 용량을 권합니다.
  # 1TB 로도 부족했다면 1TB 를 넘는 용량이 필요하다는 근거라 더 크게 반영한다
  - criterion: STORAGE
    weight: 4
    when:
      all:
        - { question: CURRENT_STORAGE, anyOf: [ TB_1_OR_MORE ] }
        - { question: STORAGE_SHORTAGE, anyOf: [ OFTEN ] }
    reason: 지금 1TB 를 쓰는데도 용량이 자주 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 2
    when:
      all:
        - { question: CURRENT_STORAGE, anyOf: [ TB_1_OR_MORE ] }
        - { question: STORAGE_SHORTAGE, anyOf: [ ONCE_OR_TWICE ] }
    reason: 지금 1TB 를 쓰는데도 용량이 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 1
    when: { question: USAGE_PERIOD, anyOf: [ FIVE_PLUS_YEARS ] }
    reason: 오래 쓸 계획이라 여유를 두었습니다.
  - criterion: STORAGE
    weight: -1
    when:
      all:
        - { question: CURRENT_STORAGE, anyOf: [ TB_1_OR_MORE ] }
        - { question: STORAGE_SHORTAGE, anyOf: [ NEVER ] }
    reason: 지금 1TB 를 쓰면서 용량이 부족한 적이 없었습니다.
  - criterion: STORAGE
    weight: -1
    when: { all: [ { question: USAGE_PERIOD, anyOf: [ TWO_YEARS ] }, { not: *smallDiskShortage } ] }
    reason: 짧게 쓸 계획이라 과한 용량을 피했습니다.

  - criterion: REQUIRED_CPU
    weight: 2
    when: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO ] }
    reason: 영상을 내보내고 효과를 미리 볼 때 CPU 를 오래 씁니다.
  - criterion: REQUIRED_CPU
    weight: 3
    when: { question: DESIGN_FIELD, anyOf: [ THREE_D ] }
    reason: 3D 렌더링은 코어를 모두 오래 씁니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when:
      all:
        - { question: DESIGN_FIELD, anyOf: [ THREE_D_LIGHT ] }
        - { not: { question: DESIGN_FIELD, anyOf: [ THREE_D ] } }
    reason: 가끔 하는 3D 렌더링도 코어를 모두 씁니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: VIDEO_RESOLUTION, anyOf: [ UHD ] }
    reason: 4K 이상 영상은 처리할 양이 많아 CPU 를 더 씁니다.
  - criterion: REQUIRED_CPU
    weight: 2
    when: { question: RENDER_WAIT, anyOf: [ OFTEN ] }
    reason: 내보내기·렌더링 대기가 답답했던 경험을 반영했습니다.
  - criterion: REQUIRED_CPU
    weight: 2
    when: { question: OVERHEATING, anyOf: [ OFTEN ] }
    reason: 지속 부하에서 발열로 성능이 떨어진 경험을 반영했습니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: MULTITASKING, anyOf: [ MANY ] }
    reason: 디자인 도구를 여러 개 함께 쓰면 작업이 겹칩니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: USAGE_PERIOD, anyOf: [ FIVE_PLUS_YEARS ] }
    reason: 오래 쓸 계획이라 여유를 두었습니다.
  - criterion: REQUIRED_CPU
    weight: -1
    when: { question: USAGE_PERIOD, anyOf: [ TWO_YEARS ] }
    reason: 짧게 쓸 계획이라 과한 사양을 피했습니다.

mappings:
  - { criterion: PREFERRED_OS, value: MAC, when: { question: PREFERRED_OS, anyOf: [ MACOS ] } }
  - { criterion: PREFERRED_OS, value: WINDOWS, when: { question: PREFERRED_OS, anyOf: [ WINDOWS ] } }
  # Sketch 는 Mac 에서만 돌아가 OS 를 정하지 않았다면 Mac 권장안을 앞세운다. 직접 고른 OS 는 덮어쓰지 않는다
  - criterion: PREFERRED_OS
    value: MAC
    when:
      all:
        - { question: PREFERRED_OS, anyOf: [ UNDECIDED ] }
        - { question: DESIGN_TOOL, anyOf: [ SKETCH ] }

  - criterion: CURRENT_CPU_TIER
    value: BASIC
    when:
      all:
        - { question: CURRENT_MAC_CPU, anyOf: [ BASIC ] }
        - &discomfort
          any:
            - { question: RENDER_WAIT, anyOf: [ OFTEN ] }
            - { question: OVERHEATING, anyOf: [ OFTEN ] }
  - criterion: CURRENT_CPU_TIER
    value: PRO
    when: { all: [ { question: CURRENT_MAC_CPU, anyOf: [ PRO ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: MAX
    when: { all: [ { question: CURRENT_MAC_CPU, anyOf: [ MAX ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: U
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ U ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: P_HS
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ P_HS ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: H
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ H ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: HX
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ HX ] }, *discomfort ] }

# 기본 권장 사양(답이 없는 0점)은 16GB·기본 칩·256GB 다. 디자이너 대부분이 Figma 로 화면 디자인을 하고,
# Figma 는 파일 하나의 메모리가 2GB 로 제한되며 Adobe 도 16GB 를 권장하기 때문이다.
# Figma 는 파일을 클라우드에 두어 운영체제와 앱을 더해도 약 75GB 라 256GB 에 여유가 있다. Adobe 를 쓰거나 원본을 노트북에 두면 512GB 이상이 된다.
# 그래픽·영상·3D 처럼 부담이 큰 작업은 설문 답으로 올린다
interpretation:
  cpu:
    MAC: [ { upTo: 2, value: BASIC }, { upTo: 4, value: PRO }, { value: MAX } ]
    WINDOWS: [ { upTo: 2, value: P_HS }, { upTo: 4, value: H }, { value: HX } ]
  # 화면 디자인만 하고 불편이 없으면 16GB, 가끔 느려지기만 해도 24GB 로 넘긴다
  memory: [ { upTo: 0, value: 16 }, { upTo: 3, value: 24 }, { upTo: 6, value: 32 }, { value: 48 } ]
  storage: [ { upTo: 0, value: 256 }, { upTo: 1, value: 512 }, { upTo: 5, value: 1024 }, { value: 2048 } ]
  # 예산을 고려해 Mac 권장 CPU 를 이 등급까지로 제한한다. M Max 칩은 권하지 않는다
  macCpuLimit: PRO

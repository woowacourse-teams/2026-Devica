# 결과 화면의 근거 문장 중 아래 7종은 이 파일이 아니라 LaptopRecommender 가 만든다.
# 피드백 받은 문장이 여기서 검색되지 않으면 그 클래스를 본다.
# 기본 권장 사양의 근거는 아래 basis 에 적는다.
#
# 점수로 고른 사양을 바꾸는 보정
#   - "지금 쓰는 <CPU>에서 불편을 겪어 그보다 위를 권합니다."      CURRENT_CPU_TIER 매핑이 있으면 CPU 를 한 단계 위로
#   - "예산을 고려해 Mac 권장 CPU는 <CPU>으로 제한했습니다."        Mac CPU 를 interpretation.macCpuLimit 까지로 제한
#   - "지금과 같은 <CPU>이라도 최신 세대를 고르면 성능이 오릅니다."  제한한 CPU 가 지금 쓰는 CPU 와 같은 등급일 때
#   - "<N>GB를 쓰려면 <CPU> 이상이어야 합니다."                     Mac 은 CPU 마다 고를 수 있는 메모리가 달라 CPU 를 올림
#   - "<CPU>에서는 <N>GB를 고를 수 없어 바로 위 용량인 <M>GB를 권합니다."  Mac 메모리를 고를 수 있는 용량으로 올림
#   - "GPU로 <칩>이 필요해 CPU도 <칩>을 권합니다."                 Mac 은 CPU 와 GPU 가 한 칩이라 GPU 칩이 더 높으면 CPU 를 올림
#   - "CPU와 같은 칩이라 GPU도 <칩>입니다."                         Mac 은 CPU 칩이 더 높으면 GPU 를 올림
#
# 규칙을 고친 뒤에는 RecommendationServiceTest 의 설명대로 스냅숏을 다시 만들어 결과 변화를 diff 로 확인한다.

survey:
  steps:
    # 모름·미입력은 답을 보내지 않는 것으로 표현한다. UNKNOWN 선택지를 두지 않는다
    - title: 현재 사용하는 노트북 사양을 알려주세요
      layout: CURRENT_SPEC
      questions:
        - code: CURRENT_OS
          title: 지금 쓰는 노트북의 OS는 무엇인가요?
          description: 모든 항목은 선택 사항입니다. 입력하지 않아도 다음으로 넘어갈 수 있어요.
          label: OS
          options:
            - { code: MACOS, content: Mac }
            - { code: WINDOWS, content: Windows }
        - code: CURRENT_MAC_CPU
          title: 지금 쓰는 Mac의 프로세서는 무엇인가요?
          label: PROCESSOR
          showWhen: { question: CURRENT_OS, anyOf: [ MACOS ] }
          options:
            - { code: BASIC, content: M 칩 }
            - { code: PRO, content: M Pro 칩 }
            - { code: MAX, content: M Max 칩 }
        - code: CURRENT_WINDOWS_CPU
          title: 지금 쓰는 노트북의 프로세서는 무엇인가요?
          label: PROCESSOR
          showWhen: { question: CURRENT_OS, anyOf: [ WINDOWS ] }
          options:
            - { code: U, content: Core Ultra 5 235U / Ryzen AI 5 340급 }
            - { code: P_HS, content: Core Ultra 7 258V / Ryzen AI 7 445급 }
            - { code: H, content: Core Ultra 7 255H / Ryzen 7 H 260급 }
            - { code: HX, content: Core Ultra 9 275HX / Ryzen 9 8940HX급 }
        - code: CURRENT_MEMORY
          title: 지금 쓰는 노트북의 메모리는 얼마인가요?
          label: MEMORY
          options:
            - { code: GB_8_OR_LESS, content: 8GB 이하 }
            - { code: GB_16, content: 16GB }
            - { code: GB_24, content: 24GB }
            - { code: GB_32, content: 32GB }
            - { code: GB_48, content: 48GB }
            - { code: GB_64_OR_MORE, content: 64GB 이상 }
        - code: CURRENT_STORAGE
          title: 지금 쓰는 노트북의 저장 공간은 얼마인가요?
          label: STORAGE
          options:
            - { code: GB_256_OR_LESS, content: 256GB 이하 }
            - { code: UNDER_1TB, content: 256GB 초과 1TB 미만 }
            - { code: TB_1_OR_MORE, content: 1TB 이상 }

    - questions:
        - code: PREFERRED_OS
          title: 어떤 노트북을 생각하고 계신가요?
          options:
            - { code: MACOS, content: Mac }
            - { code: WINDOWS, content: Windows }
            - { code: UNDECIDED, content: 아직 안 정했다, description: 결과에서 Mac과 Windows 권장안을 함께 보여드려요. }

    - questions:
        - code: DESIGN_FIELD
          title: 주로 어떤 디자인을 하나요?
          description: 여러 개를 선택할 수 있어요.
          input: MULTI
          exclusive: UNDECIDED
          options:
            - { code: UI_UX, content: "앱·웹 화면 디자인 (UI·UX)" }
            - { code: GRAPHIC, content: "편집·브랜딩·일러스트" }
            - { code: MOTION_VIDEO, content: "모션 그래픽·영상" }
            - { code: THREE_D, content: "3D 모델링·렌더링" }
            - { code: UNDECIDED, content: 아직 정하지 않았다 }

    # 4K 이상은 Adobe 가 Windows 에서 영상 작업 메모리를 두 배(32GB 이상)로 권하는 기준이라 따로 묻는다
    - questions:
        - code: VIDEO_RESOLUTION
          title: 주로 다루는 영상의 해상도는 어느 정도인가요?
          showWhen: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO ] }
          options:
            - { code: HD, content: FHD(1080p) 이하 }
            - { code: UHD, content: 4K 이상 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    # 3D 는 하는 빈도보다 한 번에 다루는 장면의 크기가 메모리를 정해 작업 내용을 따로 묻는다
    - questions:
        - code: THREE_D_WORK
          title: 주로 하는 3D 작업은 어느 정도인가요?
          showWhen: { question: DESIGN_FIELD, anyOf: [ THREE_D ] }
          options:
            - { code: SIMPLE, content: 단순한 모델을 만들거나 고친다 }
            - { code: DETAILED, content: 여러 모델과 고해상도 텍스처를 다룬다 }
            - { code: COMPLEX, content: 복잡한 장면이나 애니메이션을 렌더링한다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - title: 작업 도구를 알려주세요
      questions:
        # 도구는 OS 판단(Sketch 는 Mac)에만 쓴다. 작업 부담은 분야·무거운 파일 문항과 겹치므로 점수를 주지 않는다
        - code: DESIGN_TOOL
          title: 주로 쓰는 디자인 도구는 무엇인가요?
          description: 여러 개를 선택할 수 있어요.
          input: MULTI
          exclusive: UNDECIDED
          options:
            - { code: FIGMA, content: "Figma, Framer 등" }
            - { code: SKETCH, content: Sketch로 직접 디자인을 편집한다 }
            - { code: ADOBE, content: "Photoshop, Illustrator, After Effects 등 Adobe 도구" }
            - { code: OTHER, content: "그 밖의 도구(Blender, Cinema 4D 등)" }
            - { code: UNDECIDED, content: 아직 정하지 않았다 }
        # 도구를 정하지 않았으면 켜 두는 도구 수를 답할 수 없어 묻지 않는다. 배타 선택지라 나머지를 하나라도 고른 경우만 묻는다
        - code: MULTITASKING
          title: 작업할 때 디자인 도구를 몇 개나 함께 켜두나요?
          showWhen: { question: DESIGN_TOOL, anyOf: [ FIGMA, SKETCH, ADOBE, OTHER ] }
          options:
            - { code: MANY, content: 세 개 이상 함께 켜둔다 }
            - { code: FEW, content: 한두 개만 켜둔다 }

    - questions:
        - code: HEAVY_FILE
          title: 작업 파일이 무거워 열거나 저장할 때 오래 기다린 적이 있나요?
          description: 화면이나 레이어, 이미지가 많은 파일을 떠올려 보세요.
          options:
            - { code: OFTEN, content: 자주 그렇다 }
            - { code: FINE, content: 가끔 / 별로 없다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: ASSET_LOCATION
          title: 원본 파일이나 사진·영상 소스는 어디에 두나요?
          options:
            - { code: LOCAL_MANY, content: 대부분 노트북에 저장해 둔다 }
            - { code: MIXED, content: 자주 쓰는 것만 노트북에 둔다 }
            - { code: CLOUD, content: 클라우드나 외장 드라이브에 둔다 }

    - questions:
        - code: MULTI_APP_SLOWDOWN
          title: 디자인 도구, 크롬, 메신저 등 여러 앱을 함께 켜 두면 노트북이 느려지나요?
          options:
            - { code: OFTEN, content: 자주 느려진다 }
            - { code: SOMETIMES, content: 가끔 느려진다 }
            - { code: FINE, content: 느려지지 않는다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: STORAGE_SHORTAGE
          title: 저장 공간이 부족해서 파일을 지우거나 옮긴 적이 있나요?
          options:
            - { code: OFTEN, content: 자주 있다 }
            - { code: ONCE_OR_TWICE, content: 한두 번 있다 }
            - { code: NEVER, content: 없다 }

    - questions:
        - code: RENDER_WAIT
          title: 영상 내보내기나 렌더링이 끝나기를 기다리는 게 답답했나요?
          showWhen: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO, THREE_D ] }
          options:
            - { code: OFTEN, content: 자주 답답했다 }
            - { code: FINE, content: 참을 만했다 / 신경 안 쓰였다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: OVERHEATING
          title: 작업할 때 노트북 바닥이나 키보드가 뜨겁게 느껴지나요?
          options:
            - { code: OFTEN, content: 자주 그렇다 }
            - { code: FINE, content: 가끔 / 별로 없다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: USAGE_PERIOD
          title: 이 노트북을 얼마나 쓸 생각인가요?
          options:
            - { code: TWO_YEARS, content: 2년 정도 (곧 바꿀 수 있다) }
            - { code: THREE_TO_FOUR_YEARS, content: 3~4년 }
            - { code: FIVE_PLUS_YEARS, content: 5년 이상 / 오래 쓰고 싶다 }
            - { code: UNDECIDED, content: 아직 안 정했다 }

# 조건 하나로는 크게 오르지 않게 가중치를 나눈다 — 하나만 걸려도 최대로 올리면 답할수록 결과가 달라지지 않아
# 설문이 무의미해지고, 필요보다 높은 사양이 나온다.
rules:
  - criterion: MEMORY
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ GRAPHIC ] }
    reason: 인쇄용 고해상도 이미지와 레이어가 많은 파일은 메모리를 많이 씁니다.
  - criterion: MEMORY
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO ] }
    reason: 모션·영상 작업은 미리보기를 위해 프레임을 메모리에 올려 둡니다.
  - criterion: MEMORY
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ THREE_D ] }
    reason: 3D 작업은 장면과 텍스처를 메모리에 올려 둡니다.
  - criterion: MEMORY
    weight: 2
    when: { question: THREE_D_WORK, anyOf: [ DETAILED ] }
    reason: 여러 모델과 고해상도 텍스처를 한 번에 올려 두어 메모리를 더 씁니다.
  # 복잡한 장면은 Blender 권장(32GB·8코어)에 닿도록 분야 점수와 합쳐 메모리 4점·CPU 3점을 준다
  - criterion: MEMORY
    weight: 3
    when: { question: THREE_D_WORK, anyOf: [ COMPLEX ] }
    reason: 복잡한 장면과 애니메이션은 렌더링할 때 장면 전체를 메모리에 올려 넉넉한 용량이 필요합니다.
  - criterion: MEMORY
    weight: 3
    when: { question: VIDEO_RESOLUTION, anyOf: [ UHD ] }
    reason: 4K 이상 영상은 FHD보다 메모리를 훨씬 많이 씁니다.
  - criterion: MEMORY
    weight: 1
    when: { question: MULTITASKING, anyOf: [ MANY ] }
    reason: 디자인 도구를 여러 개 함께 켜두면 그만큼 메모리를 더 씁니다.
  - criterion: MEMORY
    weight: 1
    when: { question: HEAVY_FILE, anyOf: [ OFTEN ] }
    reason: 무거운 파일을 자주 다루는 경험을 반영했습니다.
  - criterion: MEMORY
    weight: 2
    when: { question: MULTI_APP_SLOWDOWN, anyOf: [ OFTEN ] }
    reason: 여러 프로그램을 함께 사용할 때 겪은 불편을 고려해 메모리에 여유를 두었습니다.
  - criterion: MEMORY
    weight: 1
    when: { question: MULTI_APP_SLOWDOWN, anyOf: [ SOMETIMES ] }
    reason: 가끔 느려진 경험을 반영했습니다.
  - criterion: MEMORY
    weight: 1
    when: { question: USAGE_PERIOD, anyOf: [ FIVE_PLUS_YEARS ] }
    reason: 오래 쓸 계획이라 여유를 두었습니다.
  # 짧은 사용 기간은 여유분만 덜어낸다. 공식 권장에 맞춘 작업(3D 복잡한 장면·4K 영상)의 기준 사양까지 낮추지 않는다
  - criterion: MEMORY
    weight: -1
    when:
      all:
        - { question: USAGE_PERIOD, anyOf: [ TWO_YEARS ] }
        - not: &officialWorkload
            any:
              - { question: THREE_D_WORK, anyOf: [ COMPLEX ] }
              - { question: VIDEO_RESOLUTION, anyOf: [ UHD ] }
    reason: 짧게 쓸 계획이라 과한 용량을 피했습니다.

  - criterion: STORAGE
    weight: 2
    when: { question: DESIGN_FIELD, anyOf: [ GRAPHIC ] }
    reason: 고해상도 이미지와 레이어가 많은 원본 파일은 자리를 많이 차지합니다.
  - criterion: STORAGE
    weight: 2
    when: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO ] }
    reason: 영상 소스와 미리보기 캐시가 저장 공간을 크게 씁니다.
  - criterion: STORAGE
    weight: 1
    when: { question: THREE_D_WORK, anyOf: [ DETAILED, COMPLEX ] }
    reason: 3D 장면과 텍스처, 렌더링 결과물이 자리를 차지합니다.
  - criterion: STORAGE
    weight: 2
    when: { question: VIDEO_RESOLUTION, anyOf: [ UHD ] }
    reason: 4K 이상 영상은 소스와 캐시가 FHD보다 훨씬 큽니다.
  - criterion: STORAGE
    weight: 2
    when: { question: ASSET_LOCATION, anyOf: [ LOCAL_MANY ] }
    reason: 원본 파일과 소스를 노트북에 모아 두면 저장 공간이 빠르게 찹니다.
  - criterion: STORAGE
    weight: -1
    when:
      all:
        - { question: ASSET_LOCATION, anyOf: [ CLOUD ] }
        - not: &smallDiskShortage
            all:
              - { question: CURRENT_STORAGE, anyOf: [ GB_256_OR_LESS ] }
              - { question: STORAGE_SHORTAGE, anyOf: [ OFTEN, ONCE_OR_TWICE ] }
    reason: 소스를 클라우드나 외장 드라이브에 두면 노트북 저장 공간 부담이 적습니다.
  # 지금 쓰는 SSD 가 작다는 걸 아는 경우의 용량 부족은 디스크 크기 탓이라 크게 올리지 않고, 지금보다 큰 용량만 권한다.
  # 기본값이 256GB 라 이 경우 감점(짧은 사용 기간 등)이 걸리면 다시 256GB 가 나오므로 감점을 적용하지 않는다.
  # 미입력은 작다는 근거가 없으므로 사용자의 자기 보고를 그대로 인정한다
  - criterion: STORAGE
    weight: 2
    when:
      all:
        - { not: { question: CURRENT_STORAGE, anyOf: [ GB_256_OR_LESS, TB_1_OR_MORE ] } }
        - { question: STORAGE_SHORTAGE, anyOf: [ OFTEN ] }
    reason: 용량이 자주 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 1
    when:
      all:
        - { not: { question: CURRENT_STORAGE, anyOf: [ GB_256_OR_LESS, TB_1_OR_MORE ] } }
        - { question: STORAGE_SHORTAGE, anyOf: [ ONCE_OR_TWICE ] }
    reason: 용량이 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 1
    when: *smallDiskShortage
    reason: 지금 256GB 이하에서 용량이 부족했던 경험을 반영했습니다.
  # 1TB 로도 부족했다면 1TB 를 넘는 용량이 필요하다는 근거라 더 크게 반영한다
  - criterion: STORAGE
    weight: 4
    when:
      all:
        - { question: CURRENT_STORAGE, anyOf: [ TB_1_OR_MORE ] }
        - { question: STORAGE_SHORTAGE, anyOf: [ OFTEN ] }
    reason: 지금 1TB를 쓰는데도 용량이 자주 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 2
    when:
      all:
        - { question: CURRENT_STORAGE, anyOf: [ TB_1_OR_MORE ] }
        - { question: STORAGE_SHORTAGE, anyOf: [ ONCE_OR_TWICE ] }
    reason: 지금 1TB를 쓰는데도 용량이 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 1
    when: { question: USAGE_PERIOD, anyOf: [ FIVE_PLUS_YEARS ] }
    reason: 오래 쓸 계획이라 여유를 두었습니다.
  - criterion: STORAGE
    weight: -1
    when:
      all:
        - { question: CURRENT_STORAGE, anyOf: [ TB_1_OR_MORE ] }
        - { question: STORAGE_SHORTAGE, anyOf: [ NEVER ] }
    reason: 지금 1TB를 쓰면서 용량이 부족한 적이 없었습니다.
  - criterion: STORAGE
    weight: -1
    when: { all: [ { question: USAGE_PERIOD, anyOf: [ TWO_YEARS ] }, { not: *smallDiskShortage } ] }
    reason: 짧게 쓸 계획이라 과한 용량을 피했습니다.

  - criterion: REQUIRED_CPU
    weight: 2
    when: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO ] }
    reason: 영상을 내보내고 효과를 미리 볼 때 CPU를 오래 씁니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ THREE_D ] }
    reason: 3D 렌더링은 코어를 모두 씁니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: THREE_D_WORK, anyOf: [ DETAILED ] }
    reason: 여러 모델을 다루면 화면을 돌려 보고 렌더링하는 데 CPU를 더 씁니다.
  - criterion: REQUIRED_CPU
    weight: 2
    when: { question: THREE_D_WORK, anyOf: [ COMPLEX ] }
    reason: 복잡한 장면과 애니메이션 렌더링은 코어를 모두 오래 씁니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: VIDEO_RESOLUTION, anyOf: [ UHD ] }
    reason: 4K 이상 영상은 처리할 양이 많아 CPU를 더 씁니다.
  - criterion: REQUIRED_CPU
    weight: 2
    when: { question: RENDER_WAIT, anyOf: [ OFTEN ] }
    reason: 내보내기·렌더링 대기가 답답했던 경험을 반영했습니다.
  - criterion: REQUIRED_CPU
    weight: 2
    when: { question: OVERHEATING, anyOf: [ OFTEN ] }
    reason: 작업 중 노트북이 자주 뜨거워지는 것은 오래 이어지는 부하가 크다는 신호라 반영했습니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: MULTITASKING, anyOf: [ MANY ] }
    reason: 디자인 도구를 여러 개 함께 쓰면 작업이 겹칩니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: USAGE_PERIOD, anyOf: [ FIVE_PLUS_YEARS ] }
    reason: 오래 쓸 계획이라 여유를 두었습니다.
  - criterion: REQUIRED_CPU
    weight: -1
    when: { all: [ { question: USAGE_PERIOD, anyOf: [ TWO_YEARS ] }, { not: *officialWorkload } ] }
    reason: 짧게 쓸 계획이라 과한 사양을 피했습니다.

  # 웹 화면은 sRGB 기준이라 화면 디자인만으로는 넓은 색 영역을 권하지 않는다.
  # 인쇄·브랜딩과 영상은 Apple 이 각각 P3 계열 기준 모드(Design and Print, Digital Cinema)를 두는 작업이다
  - criterion: COLOR_GAMUT
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ GRAPHIC ] }
    reason: 인쇄물과 브랜드 색은 웹 표준(sRGB)보다 넓은 색을 다뤄, 넓은 색 영역 화면이어야 색을 정확히 볼 수 있습니다.
  - criterion: COLOR_GAMUT
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO ] }
    reason: 영상은 DCI-P3 같은 넓은 색 영역으로 만들어, 화면이 그 색을 표현해야 색 보정을 정확히 할 수 있습니다.

  # Blender 는 VRAM 8GB, Premiere Pro·After Effects 는 GPU 메모리 8GB 를 권장한다. 복잡한 3D 장면과 4K 영상은 VRAM 8GB 인 RTX xx60 급까지 올린다
  - criterion: REQUIRED_GPU
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ THREE_D ] }
    reason: 3D 작업은 화면을 돌려 보고 렌더링할 때 GPU를 씁니다.
  - criterion: REQUIRED_GPU
    weight: 1
    when: { question: THREE_D_WORK, anyOf: [ DETAILED ] }
    reason: 여러 모델과 고해상도 텍스처는 그래픽 메모리를 더 씁니다.
  - criterion: REQUIRED_GPU
    weight: 2
    when: { question: THREE_D_WORK, anyOf: [ COMPLEX ] }
    reason: 복잡한 장면을 GPU로 렌더링하려면 장면이 그래픽 메모리에 다 올라가야 합니다. Blender는 VRAM 8GB를 권장합니다.
  - criterion: REQUIRED_GPU
    weight: 1
    when: { question: DESIGN_FIELD, anyOf: [ MOTION_VIDEO ] }
    reason: 영상 효과 미리보기와 내보내기는 GPU로 빨라집니다.
  - criterion: REQUIRED_GPU
    weight: 2
    when: { question: VIDEO_RESOLUTION, anyOf: [ UHD ] }
    reason: 4K 이상 영상은 GPU 메모리를 많이 씁니다. Premiere Pro는 GPU 메모리 8GB를 권장합니다.
  - criterion: REQUIRED_GPU
    weight: 1
    when: { question: RENDER_WAIT, anyOf: [ OFTEN ] }
    reason: 내보내기·렌더링 대기가 답답했던 경험을 반영했습니다.

mappings:
  - { criterion: PREFERRED_OS, value: MAC, when: { question: PREFERRED_OS, anyOf: [ MACOS ] } }
  - { criterion: PREFERRED_OS, value: WINDOWS, when: { question: PREFERRED_OS, anyOf: [ WINDOWS ] } }
  # Sketch 는 디자인 편집을 Mac 앱에서만 할 수 있어 OS 를 정하지 않았다면 Mac 권장안을 앞세운다. 직접 고른 OS 는 덮어쓰지 않는다
  - criterion: PREFERRED_OS
    value: MAC
    when:
      all:
        - { question: PREFERRED_OS, anyOf: [ UNDECIDED ] }
        - { question: DESIGN_TOOL, anyOf: [ SKETCH ] }

  - criterion: CURRENT_CPU_TIER
    value: BASIC
    when:
      all:
        - { question: CURRENT_MAC_CPU, anyOf: [ BASIC ] }
        - &discomfort
          any:
            - { question: RENDER_WAIT, anyOf: [ OFTEN ] }
            - { question: OVERHEATING, anyOf: [ OFTEN ] }
  - criterion: CURRENT_CPU_TIER
    value: PRO
    when: { all: [ { question: CURRENT_MAC_CPU, anyOf: [ PRO ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: MAX
    when: { all: [ { question: CURRENT_MAC_CPU, anyOf: [ MAX ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: U
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ U ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: P_HS
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ P_HS ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: H
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ H ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: HX
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ HX ] }, *discomfort ] }

# 기본 권장 사양(답이 없는 0점)을 정한 근거다. 화면에서 항목을 누르면 이 문장과 답으로 걸린 규칙의 reason 을 함께 보여 준다.
# os 를 적지 않으면 두 권장안에 함께 쓴다. interpretation 의 0점 값을 바꾸면 여기 적은 값과 숫자도 함께 고친다
basis:
  - item: OS
    os: MAC
    text: >-
      Figma와 Adobe 도구는 Mac과 Windows 모두에서 돌아가서, 어느 OS로도 작업할 수 있습니다. Sketch는 Mac 앱에서만 디자인을 편집할 수 있어, Sketch를 쓴다면
      Mac이 필요합니다. 이미 익숙한 OS가 있다면 그쪽을 고르셔도 됩니다.
  - item: OS
    os: WINDOWS
    text: >-
      Figma와 Photoshop, Illustrator 같은 Adobe 도구는 Windows에서도 그대로 쓸 수 있습니다. Blender처럼 외장 그래픽카드로 렌더링을 빠르게 하는 3D 도구는 외장
      GPU를 고를 수 있는 Windows 노트북이 유리합니다. 다만 Sketch는 Mac 앱에서만 디자인을 편집할 수 있어 Windows로는 쓸 수 없습니다.
  - item: REQUIRED_CPU
    os: MAC
    text: >-
      기본 권장 사양은 가벼운 앱·웹 화면 디자인을 기준으로 잡았습니다. 화면 디자인은 CPU 부담이 크지 않아 기본 M 칩으로 충분합니다. 영상 내보내기나 3D 렌더링처럼 코어를 오래 쓰는 작업을
      한다면 질문 답에 따라 Pro 칩으로 올립니다. 기본 권장 메모리 16GB는 모든 세대의 기본 칩에서 고를 수 있습니다.
  - item: REQUIRED_CPU
    os: WINDOWS
    text: >-
      기본 권장 사양은 가벼운 앱·웹 화면 디자인을 기준으로 잡았습니다. 화면 디자인은 CPU 부담이 크지 않아 고효율 Core Ultra 7·Ryzen 7급이면 충분합니다. 영상 내보내기나 3D
      렌더링처럼 코어를 오래 쓰는 작업을 한다면 질문 답에 따라 고성능 H 계열 이상으로 올립니다.
  - item: MEMORY
    text: >-
      기본 권장 사양은 가벼운 앱·웹 화면 디자인을 기준으로 잡았습니다. 이 작업은 대부분 Figma로 하고, Adobe도 Photoshop에 16GB를 권장합니다. Figma가 안내하는 2GB는 노트북
      전체가 아니라 브라우저 탭 하나가 쓸 수 있는 메모리 한도라, 노트북 메모리는 여러 도구를 함께 켤 때 차이를 만듭니다. 인쇄·영상·3D 작업을 하거나 여러 앱을 함께 켜 느려진 적이 있다면 질문
      답에 따라 24GB 이상으로 올립니다.
  - item: STORAGE
    text: >-
      Figma는 파일을 클라우드에 두어서, 운영체제와 앱을 더해도 약 75GB라 256GB에 여유가 있습니다. 그래서 가벼운 화면 디자인을 기준으로 256GB를 기본으로 권합니다. 인쇄·브랜딩이나 영상
      작업을 하거나 원본 파일과 사진·영상 소스를 노트북에 모아 둔다면 질문 답에 따라 512GB 이상으로 올립니다.
  - item: COLOR_GAMUT
    text: >-
      앱·웹 화면은 웹 표준 색 영역인 sRGB를 기준으로 만들어서, 화면 디자인만 한다면 표준 색 영역(sRGB) 화면으로 충분합니다. 영상과 브랜드 색은 sRGB보다 넓은 색을 다루는 일이 많아, 넓은
      색 영역(DCI-P3) 화면에서 색을 더 가깝게 확인할 수 있습니다. 인쇄물의 최종 색은 교정 인쇄로 확인해야 하지만, 넓은 색 영역 화면이 화면과 인쇄의 차이를 줄여 줍니다. 그래서 질문에서 편집·브랜딩이나 영상 작업을 고르면 넓은 색 영역 화면을 권합니다.
  - item: REQUIRED_GPU
    os: MAC
    text: >-
      Mac은 CPU와 GPU가 한 칩에 들어 있어서, 기본 M 칩의 GPU로 화면 디자인과 그래픽 작업을 충분히 할 수 있습니다. 영상 효과 미리보기나 3D 작업처럼 GPU를 많이 쓰는 작업은 질문
      답에 따라 GPU 코어가 더 많은 M Pro 칩으로 올립니다. 예산을 고려해 M Max 칩은 권하지 않습니다.
  - item: REQUIRED_GPU
    os: WINDOWS
    text: >-
      화면 디자인과 그래픽 작업은 CPU에 들어 있는 내장 GPU로 충분합니다. Photoshop이 권장하는 GPU 메모리 4GB는 4K 이상 모니터를 쓸 때의 기준입니다. 영상이나 단순한 3D 작업은
      보급형 외장 GPU인 RTX xx50급, 복잡한 3D 장면이나 4K 영상은 그래픽 메모리 8GB인 RTX xx60급을 질문 답에 따라 권합니다.

# 기본 권장 사양(답이 없는 0점)은 16GB·기본 칩·256GB 로, 가벼운 앱·웹 화면 디자인을 기준으로 삼는다.
# 그래픽·영상·3D 처럼 부담이 큰 작업은 설문 답으로 올린다.
# UI 디자인은 대부분 Figma 로 하고, Adobe 도 16GB 를 권장한다. Figma 의 2GB 는 앱 전체 메모리가 아니라 브라우저 탭 하나의
# WASM 메모리 한도라, 노트북 메모리는 여러 도구를 함께 켤 때 차이를 만든다.
# Figma 는 파일을 클라우드에 두어 운영체제와 앱을 더해도 약 75GB 라 256GB 에 여유가 있다. Adobe 를 쓰거나 원본을 노트북에 두면 512GB 이상이 된다.
# 4K 영상의 32GB 는 After Effects 의 Windows 권장이다. Mac 은 M Pro 칩에서 고를 수 있는 용량에 맞춰 48GB 가 나오며,
# 이는 공식 요구가 아니라 이 서비스의 추천 기준이다
interpretation:
  cpu:
    MAC: [ { upTo: 2, value: BASIC }, { upTo: 4, value: PRO }, { value: MAX } ]
    WINDOWS: [ { upTo: 2, value: P_HS }, { upTo: 4, value: H }, { value: HX } ]
  # 화면 디자인만 하고 불편이 없으면 16GB, 가끔 느려지기만 해도 24GB 로 넘긴다
  memory: [ { upTo: 0, value: 16 }, { upTo: 3, value: 24 }, { upTo: 6, value: 32 }, { value: 48 } ]
  storage: [ { upTo: 0, value: 256 }, { upTo: 1, value: 512 }, { upTo: 5, value: 1024 }, { value: 2048 } ]
  # 예산을 고려해 Mac 권장 CPU 를 이 등급까지로 제한한다. M Max 칩은 권하지 않는다
  macCpuLimit: PRO
  # 화면 디자인만 하면 표준 색 영역, 인쇄·브랜딩이나 영상을 하면 넓은 색 영역을 권한다
  colorGamut: [ { upTo: 0, value: STANDARD }, { value: WIDE } ]
  # 화면 디자인·그래픽은 내장 GPU 로 충분하다(Photoshop 권장 GPU 메모리 4GB 는 4K 이상 모니터 기준).
  # 영상이나 단순한 3D 작업은 보급 외장 GPU 인 RTX xx50 급, 복잡한 3D 장면과 4K 영상은 VRAM 8GB 인 RTX xx60 급을 권한다.
  # Mac 은 CPU 와 같이 예산을 고려해 M Pro 칩까지만 권한다
  gpu:
    MAC: [ { upTo: 0, value: BASIC }, { value: PRO } ]
    WINDOWS: [ { upTo: 0, value: INTEGRATED }, { upTo: 2, value: XX50 }, { value: XX60 } ]

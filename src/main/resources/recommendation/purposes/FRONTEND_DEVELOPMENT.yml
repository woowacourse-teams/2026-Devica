# 결과 화면의 근거 문장 중 아래 5종은 이 파일이 아니라 LaptopRecommender 가 만든다.
# 피드백 받은 문장이 여기서 검색되지 않으면 그 클래스를 본다.
# 기본 권장 사양의 근거는 아래 basis 에 적는다.
#
# 점수로 고른 사양을 바꾸는 보정
#   - "지금 쓰는 <CPU> 에서 불편을 겪어 그보다 위를 권합니다."      CURRENT_CPU_TIER 매핑이 있으면 CPU 를 한 단계 위로
#   - "예산을 고려해 Mac 권장 CPU 는 <CPU>으로 제한했습니다."        Mac CPU 를 interpretation.macCpuLimit 까지로 제한
#   - "지금과 같은 <CPU>이라도 최신 세대를 고르면 성능이 오릅니다."  제한한 CPU 가 지금 쓰는 CPU 와 같은 등급일 때
#   - "<N>GB 를 쓰려면 <CPU> 이상이어야 합니다."                     Mac 은 CPU 마다 고를 수 있는 메모리가 달라 CPU 를 올림
#   - "<CPU>에서는 <N>GB 를 고를 수 없어 바로 위 용량인 <M>GB 를 권합니다."  Mac 메모리를 고를 수 있는 용량으로 올림
#
# 규칙을 고친 뒤에는 RecommendationServiceTest 의 설명대로 스냅숏을 다시 만들어 결과 변화를 diff 로 확인한다.

survey:
  steps:
    # 모름·미입력은 답을 보내지 않는 것으로 표현한다. UNKNOWN 선택지를 두지 않는다
    - title: 현재 사용하는 노트북 사양을 알려주세요
      layout: CURRENT_SPEC
      questions:
        - code: CURRENT_OS
          title: 지금 쓰는 노트북의 OS는 무엇인가요?
          description: 모든 항목은 선택 사항입니다. 입력하지 않아도 다음으로 넘어갈 수 있어요.
          label: OS
          options:
            - { code: MACOS, content: Mac }
            - { code: WINDOWS, content: Windows }
        - code: CURRENT_MAC_CPU
          title: 지금 쓰는 Mac의 프로세서는 무엇인가요?
          label: PROCESSOR
          showWhen: { question: CURRENT_OS, anyOf: [ MACOS ] }
          options:
            - { code: BASIC, content: M 칩 }
            - { code: PRO, content: M Pro 칩 }
            - { code: MAX, content: M Max 칩 }
        - code: CURRENT_WINDOWS_CPU
          title: 지금 쓰는 노트북의 프로세서는 무엇인가요?
          label: PROCESSOR
          showWhen: { question: CURRENT_OS, anyOf: [ WINDOWS ] }
          options:
            - { code: U, content: Core Ultra 5 235U / Ryzen AI 5 340급 }
            - { code: P_HS, content: Core Ultra 7 258V / Ryzen AI 7 445급 }
            - { code: H, content: Core Ultra 7 255H / Ryzen 7 H 260급 }
            - { code: HX, content: Core Ultra 9 275HX / Ryzen 9 8940HX급 }
        - code: CURRENT_MEMORY
          title: 지금 쓰는 노트북의 메모리는 얼마인가요?
          label: MEMORY
          options:
            - { code: GB_8_OR_LESS, content: 8GB 이하 }
            - { code: GB_16, content: 16GB }
            - { code: GB_24, content: 24GB }
            - { code: GB_32, content: 32GB }
            - { code: GB_48, content: 48GB }
            - { code: GB_64_OR_MORE, content: 64GB 이상 }
        - code: CURRENT_STORAGE
          title: 지금 쓰는 노트북의 저장 공간은 얼마인가요?
          label: STORAGE
          options:
            - { code: GB_256_OR_LESS, content: 256GB 이하 }
            - { code: UNDER_1TB, content: 256GB 초과 1TB 미만 }
            - { code: TB_1_OR_MORE, content: 1TB 이상 }

    - questions:
        - code: PREFERRED_OS
          title: 어떤 노트북을 생각하고 계신가요?
          options:
            - { code: MACOS, content: Mac }
            - { code: WINDOWS, content: Windows }
            - { code: UNDECIDED, content: 아직 안 정했다, description: 결과에서 Mac과 Windows 권장안을 함께 보여드려요. }

    - questions:
        - code: PROJECT_SCALE
          title: 개발할 때 한 번에 실행하고 빌드하는 범위는 어느 정도인가요?
          options:
            - { code: SMALL, content: 작은 앱 하나 }
            - { code: SINGLE_SERVICE, content: 기능이 많은 서비스 하나 }
            - { code: LARGE, content: 여러 앱·패키지를 함께 실행하고 빌드한다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - title: 개발 도구를 알려주세요
      questions:
        - code: IDE
          title: 어떤 에디터를 쓰나요?
          options:
            - { code: LIGHT_EDITOR, content: "VS Code, Vim, Neovim 등" }
            - { code: JETBRAINS, content: "WebStorm 등 JetBrains 제품" }
            - { code: MULTIPLE, content: 여러 개를 동시에 함께 쓴다 }
            - { code: UNKNOWN, content: 아직 모르겠다 }
        - code: AI_CODING_TOOL
          title: 코딩할 때 어떤 AI 도구를 쓰나요? (복수 선택)
          input: MULTI
          exclusive: NONE
          options:
            - { code: AI_EDITOR, content: "에디터 안에서 쓰는 AI (Cursor, IntelliJ의 AI)" }
            - { code: AI_CHAT, content: "따로 쓰는 AI 채팅 (ChatGPT, Claude, Gemini)" }
            - { code: NONE, content: 사용하지 않음 }

    - questions:
        - code: OPEN_TOGETHER
          title: 개발하면서 함께 켜 두는 것을 모두 골라 주세요
          description: 여러 개를 선택할 수 있어요.
          input: MULTI
          exclusive: NONE
          options:
            - { code: MANY_TABS, content: 브라우저 탭 여러 개와 개발자 도구 }
            - { code: MULTI_BROWSER, content: "크롬, 사파리 등 여러 브라우저" }
            - { code: DESIGN_TOOL, content: Figma 같은 디자인 도구 }
            - { code: NONE, content: 위 항목에 해당하지 않는다 }

    - questions:
        - code: RUN_TOGETHER
          title: 개발 서버 말고 함께 띄우는 것이 있나요?
          description: 여러 개를 선택할 수 있어요.
          input: MULTI
          exclusive: NONE
          options:
            - { code: DEV_TOOLS, content: "Storybook, 테스트 감시 모드 등" }
            - { code: LOCAL_BACKEND, content: 백엔드나 DB를 로컬·도커로 함께 띄운다 }
            - { code: E2E_TEST, content: "Playwright, Cypress로 E2E 테스트를 돌린다" }
            - { code: NONE, content: 따로 띄우는 것은 없다·잘 모르겠다 }

    - questions:
        - code: MULTI_APP_SLOWDOWN
          title: 개발 도구, 크롬, 메신저 등 여러 앱을 함께 켜 두면 노트북이 느려지나요?
          options:
            - { code: OFTEN, content: 자주 느려진다 }
            - { code: SOMETIMES, content: 가끔 느려진다 }
            - { code: FINE, content: 느려지지 않는다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: STORAGE_SHORTAGE
          title: 저장 공간이 부족해서 파일을 지우거나 옮긴 적이 있나요?
          options:
            - { code: OFTEN, content: 자주 있다 }
            - { code: ONCE_OR_TWICE, content: 한두 번 있다 }
            - { code: NEVER, content: 없다 }

    - questions:
        - code: BUILD_WAIT
          title: 개발 서버 시작, 수정 반영, 빌드가 느려서 답답했나요?
          options:
            - { code: OFTEN, content: 자주 답답했다 }
            - { code: FINE, content: 참을 만했다 / 신경 안 쓰였다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: OVERHEATING
          title: 개발할 때 노트북 바닥이나 키보드가 뜨겁게 느껴지나요?
          options:
            - { code: OFTEN, content: 자주 그렇다 }
            - { code: FINE, content: 가끔 / 별로 없다 }
            - { code: UNKNOWN, content: 잘 모르겠다 }

    - questions:
        - code: USAGE_PERIOD
          title: 이 노트북을 얼마나 쓸 생각인가요?
          options:
            - { code: TWO_YEARS, content: 2년 정도 (곧 바꿀 수 있다) }
            - { code: THREE_TO_FOUR_YEARS, content: 3~4년 }
            - { code: FIVE_PLUS_YEARS, content: 5년 이상 / 오래 쓰고 싶다 }
            - { code: UNDECIDED, content: 아직 안 정했다 }

# 조건 하나로는 크게 오르지 않게 가중치를 나눈다 — 하나만 걸려도 최대로 올리면 답할수록 결과가 달라지지 않아
# 설문이 무의미해지고, 필요보다 높은 사양이 나온다.
rules:
  - criterion: MEMORY
    weight: 2
    when: { question: PROJECT_SCALE, anyOf: [ LARGE ] }
    reason: 의존성이 많은 큰 프로젝트는 개발 서버와 빌드가 메모리를 많이 씁니다.
  - criterion: MEMORY
    weight: -1
    when: { question: PROJECT_SCALE, anyOf: [ SMALL ] }
    reason: 작은 프로젝트는 개발 서버가 차지하는 메모리가 적습니다.
  - criterion: MEMORY
    weight: 1
    when: { question: IDE, anyOf: [ JETBRAINS ] }
    reason: JetBrains IDE는 인덱싱과 코드 분석에 메모리를 많이 씁니다.
  - criterion: MEMORY
    weight: 2
    when: { question: IDE, anyOf: [ MULTIPLE ] }
    reason: 여러 에디터를 함께 띄우면 그만큼 더 듭니다.
  - criterion: MEMORY
    weight: 1
    when: { question: AI_CODING_TOOL, anyOf: [ AI_EDITOR ] }
    reason: AI 전용 에디터는 모델 연동으로 메모리를 더 씁니다.
  - criterion: MEMORY
    weight: 1
    when: { question: OPEN_TOGETHER, anyOf: [ MANY_TABS ] }
    reason: 브라우저 탭과 개발자 도구는 탭마다 메모리를 따로 차지합니다.
  - criterion: MEMORY
    weight: 1
    when: { question: OPEN_TOGETHER, anyOf: [ MULTI_BROWSER ] }
    reason: 여러 브라우저를 함께 띄우면 그만큼 메모리를 더 씁니다.
  - criterion: MEMORY
    weight: 1
    when: { question: OPEN_TOGETHER, anyOf: [ DESIGN_TOOL ] }
    reason: 디자인 도구를 함께 켜 두면 메모리를 더 씁니다.
  - criterion: MEMORY
    weight: 1
    when: { question: RUN_TOGETHER, anyOf: [ DEV_TOOLS ] }
    reason: Storybook이나 테스트 감시 모드는 개발 서버와 별도로 메모리를 씁니다.
  - criterion: MEMORY
    weight: 2
    when: { question: RUN_TOGETHER, anyOf: [ LOCAL_BACKEND ] }
    reason: 백엔드와 DB를 함께 띄우면 그만큼 메모리를 차지합니다.
  - criterion: MEMORY
    weight: 1
    when: { question: RUN_TOGETHER, anyOf: [ E2E_TEST ] }
    reason: E2E 테스트는 테스트용 브라우저를 따로 띄워 메모리를 더 씁니다.
  - criterion: MEMORY
    weight: 2
    when: { question: MULTI_APP_SLOWDOWN, anyOf: [ OFTEN ] }
    reason: 여러 프로그램을 함께 사용할 때 겪은 불편을 고려해 메모리에 여유를 두었습니다.
  - criterion: MEMORY
    weight: 1
    when: { question: MULTI_APP_SLOWDOWN, anyOf: [ SOMETIMES ] }
    reason: 가끔 느려진 경험을 반영했습니다.
  - criterion: MEMORY
    weight: 1
    when: { question: USAGE_PERIOD, anyOf: [ FIVE_PLUS_YEARS ] }
    reason: 오래 쓸 계획이라 여유를 두었습니다.
  - criterion: MEMORY
    weight: -1
    when: { question: USAGE_PERIOD, anyOf: [ TWO_YEARS ] }
    reason: 짧게 쓸 계획이라 과한 용량을 피했습니다.

  - criterion: STORAGE
    weight: 1
    when: { question: PROJECT_SCALE, anyOf: [ LARGE ] }
    reason: 큰 프로젝트는 의존성과 빌드 캐시가 자리를 많이 차지합니다.
  - criterion: STORAGE
    weight: 1
    when: { question: RUN_TOGETHER, anyOf: [ LOCAL_BACKEND ] }
    reason: 백엔드와 DB의 이미지·데이터가 자리를 차지합니다.
  # 지금 쓰는 SSD 가 작다는 걸 아는 경우의 용량 부족은 디스크 크기 탓이라 크게 올리지 않고, 지금보다 큰 용량만 권한다.
  # 기본값이 256GB 라 이 경우 감점(짧은 사용 기간 등)이 걸리면 다시 256GB 가 나오므로 감점을 적용하지 않는다.
  # 미입력은 작다는 근거가 없으므로 사용자의 자기 보고를 그대로 인정한다
  - criterion: STORAGE
    weight: 2
    when:
      all:
        - { not: { question: CURRENT_STORAGE, anyOf: [ GB_256_OR_LESS, TB_1_OR_MORE ] } }
        - { question: STORAGE_SHORTAGE, anyOf: [ OFTEN ] }
    reason: 용량이 자주 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 1
    when:
      all:
        - { not: { question: CURRENT_STORAGE, anyOf: [ GB_256_OR_LESS, TB_1_OR_MORE ] } }
        - { question: STORAGE_SHORTAGE, anyOf: [ ONCE_OR_TWICE ] }
    reason: 용량이 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 1
    when: &smallDiskShortage
      all:
        - { question: CURRENT_STORAGE, anyOf: [ GB_256_OR_LESS ] }
        - { question: STORAGE_SHORTAGE, anyOf: [ OFTEN, ONCE_OR_TWICE ] }
    reason: 지금 256GB 이하에서 용량이 부족했던 경험을 반영했습니다.
  # 1TB 로도 부족했다면 1TB 를 넘는 용량이 필요하다는 근거라 더 크게 반영한다
  - criterion: STORAGE
    weight: 4
    when:
      all:
        - { question: CURRENT_STORAGE, anyOf: [ TB_1_OR_MORE ] }
        - { question: STORAGE_SHORTAGE, anyOf: [ OFTEN ] }
    reason: 지금 1TB를 쓰는데도 용량이 자주 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 2
    when:
      all:
        - { question: CURRENT_STORAGE, anyOf: [ TB_1_OR_MORE ] }
        - { question: STORAGE_SHORTAGE, anyOf: [ ONCE_OR_TWICE ] }
    reason: 지금 1TB를 쓰는데도 용량이 부족했던 경험을 반영했습니다.
  - criterion: STORAGE
    weight: 1
    when: { question: USAGE_PERIOD, anyOf: [ FIVE_PLUS_YEARS ] }
    reason: 오래 쓸 계획이라 여유를 두었습니다.
  - criterion: STORAGE
    weight: -1
    when:
      all:
        - { question: CURRENT_STORAGE, anyOf: [ TB_1_OR_MORE ] }
        - { question: STORAGE_SHORTAGE, anyOf: [ NEVER ] }
    reason: 지금 1TB를 쓰면서 용량이 부족한 적이 없었습니다.
  - criterion: STORAGE
    weight: -1
    when: { all: [ { question: USAGE_PERIOD, anyOf: [ TWO_YEARS ] }, { not: *smallDiskShortage } ] }
    reason: 짧게 쓸 계획이라 과한 용량을 피했습니다.

  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: PROJECT_SCALE, anyOf: [ LARGE ] }
    reason: 큰 프로젝트는 번들링과 타입 검사에 CPU를 많이 씁니다.
  - criterion: REQUIRED_CPU
    weight: 2
    when: { question: BUILD_WAIT, anyOf: [ OFTEN ] }
    reason: 개발 서버와 빌드가 느려 답답했던 경험을 반영했습니다.
  - criterion: REQUIRED_CPU
    weight: 2
    when: { question: OVERHEATING, anyOf: [ OFTEN ] }
    reason: 작업 중 노트북이 자주 뜨거워지는 것은 오래 이어지는 부하가 크다는 신호라 반영했습니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: RUN_TOGETHER, anyOf: [ E2E_TEST ] }
    reason: E2E 테스트를 실행하는 데 필요한 CPU 자원을 고려했습니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: RUN_TOGETHER, anyOf: [ LOCAL_BACKEND ] }
    reason: 백엔드와 DB를 함께 돌리면 코어가 더 필요합니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: IDE, anyOf: [ MULTIPLE ] }
    reason: 여러 에디터를 함께 쓰면 백그라운드 작업이 겹칩니다.
  - criterion: REQUIRED_CPU
    weight: 1
    when: { question: USAGE_PERIOD, anyOf: [ FIVE_PLUS_YEARS ] }
    reason: 오래 쓸 계획이라 여유를 두었습니다.
  - criterion: REQUIRED_CPU
    weight: -1
    when: { question: USAGE_PERIOD, anyOf: [ TWO_YEARS ] }
    reason: 짧게 쓸 계획이라 과한 사양을 피했습니다.

mappings:
  - { criterion: PREFERRED_OS, value: MAC, when: { question: PREFERRED_OS, anyOf: [ MACOS ] } }
  - { criterion: PREFERRED_OS, value: WINDOWS, when: { question: PREFERRED_OS, anyOf: [ WINDOWS ] } }

  - criterion: CURRENT_CPU_TIER
    value: BASIC
    when:
      all:
        - { question: CURRENT_MAC_CPU, anyOf: [ BASIC ] }
        - &discomfort
          any:
            - { question: BUILD_WAIT, anyOf: [ OFTEN ] }
            - { question: OVERHEATING, anyOf: [ OFTEN ] }
  - criterion: CURRENT_CPU_TIER
    value: PRO
    when: { all: [ { question: CURRENT_MAC_CPU, anyOf: [ PRO ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: MAX
    when: { all: [ { question: CURRENT_MAC_CPU, anyOf: [ MAX ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: U
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ U ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: P_HS
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ P_HS ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: H
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ H ] }, *discomfort ] }
  - criterion: CURRENT_CPU_TIER
    value: HX
    when: { all: [ { question: CURRENT_WINDOWS_CPU, anyOf: [ HX ] }, *discomfort ] }

# 기본 권장 사양(답이 없는 0점)을 정한 근거다. 화면에서 항목을 누르면 이 문장과 답으로 걸린 규칙의 reason 을 함께 보여 준다.
# os 를 적지 않으면 두 권장안에 함께 쓴다. interpretation 의 0점 값을 바꾸면 여기 적은 값과 숫자도 함께 고친다
basis:
  - item: OS
    os: MAC
    text: >-
      프론트엔드 개발 도구는 Node.js 기반이라 Mac과 Windows 어디서나 돌아가서, 두 OS의 권장안을 함께 보여 드립니다. Mac에서는 Safari로 화면을 직접 확인할 수 있어 Apple
      기기 사용자를 위한 확인이 수월합니다. 터미널 환경이 서버와 같은 Unix 계열이라 설치 문서의 명령을 그대로 쓰기 쉽습니다. 이미 익숙한 OS가 있다면 그쪽을 고르셔도 됩니다.
  - item: OS
    os: WINDOWS
    text: >-
      프론트엔드 개발 도구는 Node.js 기반이라 Windows에서도 문제없이 돌아갑니다. Windows 사용자에게 보이는 브라우저 화면과 글꼴을 직접 확인할 수 있다는 장점이 있습니다. 다만
      Safari로 확인해야 하는 화면은 Mac이나 실제 기기가 따로 필요합니다. 이미 Windows에 익숙하다면 굳이 Mac으로 바꿀 필요는 없습니다.
  - item: REQUIRED_CPU
    os: MAC
    text: >-
      프론트엔드 개발은 개발 서버 하나와 브라우저를 함께 돌리는 것이 기본이라, 기본 M 칩으로도 개발 서버 시작과 수정 반영이 충분히 빠릅니다. 번들링과 타입 검사처럼 코어를 많이 쓰는 작업은
      프로젝트가 커질수록 늘어납니다. 그래서 기본 칩을 권하고, 여러 앱·패키지를 함께 빌드하거나 빌드 대기가 답답했다면 질문 답에 따라 Pro 칩으로 올립니다. 기본 권장 메모리 16GB는 모든 세대의
      기본 칩에서 고를 수 있습니다.
  - item: REQUIRED_CPU
    os: WINDOWS
    text: >-
      프론트엔드 개발은 개발 서버 하나와 브라우저를 함께 돌리는 것이 기본이라, 고효율 Core Ultra 7·Ryzen 7급이면 충분합니다. 번들링과 타입 검사처럼 코어를 많이 쓰는 작업은 프로젝트가
      커질수록 늘어납니다. 여러 앱·패키지를 함께 빌드하거나 빌드 대기가 답답했다면 질문 답에 따라 고성능 H 계열로 올립니다.
  - item: MEMORY
    text: >-
      운영체제와 브라우저, 에디터, 개발 서버를 가볍게 잡으면 7~12GB라 16GB 안에 들어갑니다. 백엔드 개발처럼 Docker와 데이터베이스를 기본으로 띄우지 않아 그보다 높게 둘 이유가 없습니다.
      그래서 노트북 메모리 단계 중 가장 낮은 16GB를 기본으로 권합니다. 브라우저 탭과 개발자 도구를 많이 띄우거나 Storybook·E2E 테스트, 로컬 백엔드를 함께 돌린다면 질문 답에 따라
      24GB 이상으로 올립니다.
  - item: STORAGE
    text: >-
      운영체제와 Node.js, 패키지 캐시, 프로젝트의 node_modules를 더하면 60~90GB 정도입니다. SSD는 속도와 수명을 위해 20% 정도 비워 두는 편이 좋은데, 그만큼을 빼도
      256GB에 여유가 남습니다. 백엔드 개발은 Docker가 20~40GB를 더 써서 512GB를 권하지만, 프론트엔드는 그렇지 않아 256GB를 기본으로 권합니다. 큰 프로젝트나 로컬 백엔드·DB를
      함께 다루거나 용량 부족을 겪었다면 질문 답에 따라 512GB 이상으로 올립니다.

# 프론트엔드 개발은 개발 서버 하나와 브라우저가 기본이라 백엔드보다 CPU 구간을 넓게 잡는다.
# 보통의 답(기능이 많은 서비스 하나, 탭 여러 개, Storybook, 가끔 느려짐)은 메모리 3점·CPU 0점·저장 공간 0점으로 24GB·기본 칩·256GB 가 나온다
# 기본 권장 사양(답이 없는 0점)은 16GB·기본 칩·256GB 다. 운영체제·브라우저·에디터·개발 서버를 가볍게 잡으면 7~12GB 라
# 16GB 에 들어가고, 백엔드처럼 Docker 가 기본으로 깔리지 않아 백엔드(16GB)보다 높게 둘 이유가 없다.
# 저장 공간도 운영체제·Node·캐시·node_modules 를 더하면 60~90GB 라, SSD 의 20% 를 비워 두어도 256GB 에 여유가 있다.
# 백엔드는 Docker 가 20~40GB 를 더 써 512GB 다. 저장 공간을 올리는 답이 하나라도 있으면 512GB 가 된다
interpretation:
  cpu:
    MAC: [ { upTo: 2, value: BASIC }, { upTo: 5, value: PRO }, { value: MAX } ]
    WINDOWS: [ { upTo: 2, value: P_HS }, { upTo: 5, value: H }, { value: HX } ]
  memory: [ { upTo: 2, value: 16 }, { upTo: 5, value: 24 }, { upTo: 9, value: 32 }, { value: 48 } ]
  storage: [ { upTo: 0, value: 256 }, { upTo: 2, value: 512 }, { upTo: 5, value: 1024 }, { value: 2048 } ]
  # 예산을 고려해 Mac 권장 CPU 를 이 등급까지로 제한한다. M Max 칩은 권하지 않는다
  macCpuLimit: PRO

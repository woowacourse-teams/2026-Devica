spring:
  application:
    name: devica

  profiles:
    default: local

  flyway:
    enabled: true
    # 이력 없는 기존 DB 를 기준선으로 삼지 않는다. 빈 DB 에서 시작한다 (ADR 0028)
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

management:
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState, db
  metrics:
    distribution:
      slo:
        http.server.requests: 100ms, 300ms, 500ms, 1s, 2s, 5s

app:
  public-base-url: ${DEVICA_PUBLIC_BASE_URL:https://devica.co.kr}
  product-image-base-url: ${PRODUCT_IMAGE_BASE_URL}

coupang:
  access-key: ${COUPANG_ACCESS_KEY:}
  secret-key: ${COUPANG_SECRET_KEY:}
  price-refresh:
    enabled: ${COUPANG_PRICE_REFRESH_ENABLED:false}
    # 수동 1회 실행은 local 프로파일·웹 비기동·cron=- 설정에서만 허용한다.
    run-once: ${COUPANG_PRICE_REFRESH_RUN_ONCE:false}
    # 한국 시간 매일 04:00. 활성화한 서버 한 대에서만 실행한다.
    cron: ${COUPANG_PRICE_REFRESH_CRON:0 0 4 * * *}

logging:
  structured:
    json:
      exclude: service
  level:
    root: info
    # Spring 이 405 요청마다 이 로거로 WARN 을 한 줄 남기는데, GlobalExceptionHandler 도 같은 요청을 WARN 으로 남겨 중복된다.
    # ERROR 로 올려 이 로거의 WARN 을 끈다.
    org.springframework.web.servlet.PageNotFound: error

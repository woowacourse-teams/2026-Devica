spring:
  application:
    name: devica

  profiles:
    default: local

  flyway:
    enabled: true
    # 이력 없는 기존 DB 를 기준선으로 삼지 않는다. 빈 DB 에서 시작한다 (ADR 0028)
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

logging:
  structured:
    json:
      exclude: service
  level:
    root: info
    # Spring 이 405 요청마다 이 로거로 WARN 을 한 줄 남기는데, GlobalExceptionHandler 도 같은 요청을 WARN 으로 남겨 중복된다.
    # ERROR 로 올려 이 로거의 WARN 을 끈다.
    org.springframework.web.servlet.PageNotFound: error

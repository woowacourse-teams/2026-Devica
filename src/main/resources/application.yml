spring:
  application:
    name: devica

  profiles:
    default: local

  flyway:
    enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

logging:
  level:
    # 405 등을 GlobalExceptionHandler 와 한 번 더 WARN 으로 남기는 Spring 로거라 끈다
    org.springframework.web.servlet.PageNotFound: error

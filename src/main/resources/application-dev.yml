# 개발 서버용. 각자의 노트북에서 띄우는 로컬은 application-local.yml 을 쓴다.
spring:
  datasource:
    url: jdbc:mysql://db:3306/${MYSQL_DATABASE}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  structured:
    format:
      console: ecs
  level:
    com.wrb.devica: debug

management:
  endpoints:
    web:
      exposure:
        include: health

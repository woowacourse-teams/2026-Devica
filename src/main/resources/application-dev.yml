# 개발 서버용. 각자의 노트북에서 띄우는 로컬은 application-local.yml 을 쓴다.
spring:
  datasource:
    url: jdbc:mysql://db:3306/${MYSQL_DATABASE}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

management:
  # compose 가 호스트에 열지 않는 포트, 같은 도커 네트워크의 수집 에이전트만 접근을 허용한다.
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, prometheus

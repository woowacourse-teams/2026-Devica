spring:
  datasource:
    url: jdbc:mysql://db:3306/${MYSQL_DATABASE}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 엔티티 매핑과 실제 스키마가 어긋나면 기동을 실패시킨다.
      ddl-auto: validate
    show-sql: false

logging:
  structured:
    format:
      # ECS 형식 JSON 을 stdout 으로 낸다 (ADR 0032)
      console: ecs
    json:
      # service.* 는 수집기(Alloy)가 붙이는 app·env 레이블과 겹쳐 본문에서 뺀다
      exclude: service

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

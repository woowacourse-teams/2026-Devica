spring:
  datasource:
    url: jdbc:mysql://db:3306/${MYSQL_DATABASE}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 환경 변수로 열어두지 않는다. 운영에서 update 로 뜨면 배포가 곧 스키마 변경이 되어
      # 애플리케이션만 되돌아가고 스키마는 남는다. 즉 롤백이 성립하지 않는다.
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health

# 서버 배포용. 개발 서버와 운영 서버가 이 파일 하나를 함께 쓴다.
# 그래서 개발 서버도 prod 프로파일로 뜬다. 로컬 개발은 docker-compose.yml 을 쓴다.
#   IMAGE_TAG=<커밋 SHA> docker compose -f docker-compose.prod.yml up -d
services:
  app:
    # 레지스트리에 없다. CodeBuild 가 만든 image.tar 를 배포 훅이 docker load 로 올린다.
    image: devica:${IMAGE_TAG}
    pull_policy: never
    container_name: devica-app
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
    ports:
      # 운영은 ALB 가, 개발은 클라이언트가 직접 EC2 의 80 번으로 보낸다
      - "80:8080"
    depends_on:
      db:
        # MySQL 은 컨테이너가 뜬 뒤에도 초기화에 수십 초가 걸린다
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: devica-db
    env_file: .env
    environment:
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      # 운영 데이터의 전부다. down -v 를 실행하면 사라진다
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ 는 컨테이너 안 셸이 변수를 풀도록 이스케이프한 것이다
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
